<!-- canary Transcript Analysis Embed -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<div id="hmcanary"></div>

<style>
  :root{ --hm-black:#000000; --hm-white:#FFFFFF; --hm-copper:#D18057; }
  #hmcanary *{ box-sizing:border-box; }
  #hmcanary .canary-wrap{
    font-family:"Montserrat",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--hm-black);
    color:var(--hm-white);
    border:1px solid var(--hm-copper);
    padding:18px;
    letter-spacing:.2px;
  }
  #hmcanary .canary-title{ display:flex; align-items:center; gap:12px; margin:0 0 10px; }


  #hmcanary .canary-kicker{ color:var(--hm-copper); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1.4px; margin:0 0 3px; }
  #hmcanary h2{ margin:0; font-size:24px; line-height:1.1; text-transform:uppercase; letter-spacing:1.2px; }
  #hmcanary .canary-sub{ margin:0 0 14px; color:rgba(255,255,255,.82); font-size:12px; line-height:1.55; }
  #hmcanary .canary-note{ border:1px solid rgba(209,128,87,.45); padding:10px; margin:10px 0 14px; color:rgba(255,255,255,.78); font-size:11px; line-height:1.5; }
  #hmcanary .canary-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  #hmcanary .canary-file{ flex:1 1 260px; min-width:220px; border:1px solid var(--hm-copper); padding:10px 12px; color:rgba(255,255,255,.85); background:transparent; font-size:12px; }
  #hmcanary input[type="file"]::file-selector-button{ border:1px solid var(--hm-copper); background:transparent; color:var(--hm-white); padding:8px 10px; text-transform:uppercase; letter-spacing:1px; font-weight:600; cursor:pointer; margin-right:10px; }
  #hmcanary input[type="file"]::file-selector-button:hover, #hmcanary .canary-btn:hover{ background:var(--hm-copper); color:var(--hm-black); }
  #hmcanary .canary-btn{ appearance:none; background:transparent; color:var(--hm-white); border:1px solid var(--hm-copper); padding:10px 12px; cursor:pointer; text-transform:uppercase; letter-spacing:1.1px; font-weight:600; font-size:12px; height:44px; }
  #hmcanary .canary-btn:disabled{ opacity:.55; cursor:not-allowed; }
  #hmcanary .canary-status{ margin-left:auto; font-size:12px; text-transform:uppercase; letter-spacing:.9px; color:rgba(255,255,255,.85); }
  #hmcanary .canary-status.is-error{ color:var(--hm-copper); }
  #hmcanary .canary-divider{ height:1px; background:rgba(209,128,87,.45); margin:14px 0; }
  #hmcanary .canary-results{ border:1px solid var(--hm-copper); background:rgba(255,255,255,.02); padding:12px; min-height:160px; max-height:720px; overflow:auto; font-size:13px; line-height:1.6; }
  #hmcanary .canary-results p{ margin:0 0 10px; }
  #hmcanary .canary-results strong{ color:var(--hm-copper); text-transform:uppercase; letter-spacing:.9px; }
  #hmcanary .canary-results ul{ margin:8px 0 12px 18px; padding:0; }
  #hmcanary .canary-results li{ margin:5px 0; }
  #hmcanary .canary-table-wrap{ width:100%; overflow-x:auto; margin:10px 0 12px; }
  #hmcanary table{ width:100%; min-width:620px; border-collapse:collapse; border:1px solid rgba(209,128,87,.55); color:rgba(255,255,255,.92); font-size:12px; line-height:1.45; }
  #hmcanary th,#hmcanary td{ border:1px solid rgba(209,128,87,.42); padding:9px 10px; vertical-align:top; text-align:left; }
  #hmcanary th{ color:var(--hm-copper); background:rgba(209,128,87,.1); text-transform:uppercase; letter-spacing:.8px; }
  #hmcanary .canary-textarea{ width:100%; min-height:92px; resize:vertical; background:transparent; color:var(--hm-white); border:1px solid var(--hm-copper); padding:12px; outline:none; font-size:13px; line-height:1.45; }
  #hmcanary .canary-textarea::placeholder{ color:rgba(255,255,255,.62); }
  #hmcanary .canary-library{
  border:1px solid var(--hm-copper);
  background:rgba(255,255,255,.02);
  padding:12px;
  margin:12px 0;
}

#hmcanary .canary-library-title{
  color:var(--hm-copper);
  font-size:12px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:1.1px;
  margin-bottom:10px;
}

#hmcanary .canary-library-item{
  display:flex;
  justify-content:space-between;
  gap:12px;
  border-top:1px solid rgba(209,128,87,.45);
  padding:12px 0;
}

#hmcanary .canary-library-item:first-of-type{
  border-top:0;
}

#hmcanary .canary-library-meta{
  font-size:12px;
  line-height:1.55;
}

#hmcanary .canary-library-actions{
  display:flex;
  gap:8px;
  align-items:flex-start;
}

#hmcanary .canary-select-toggle{
  min-width:112px;
}

#hmcanary .canary-library-empty{
  color:rgba(255,255,255,.72);
  font-size:12px;
}
</style>

<script>
(() => {
  const API_BASE = "https://trend-report-platform.vercel.app";
  const DEMO_TOKEN = "";
  const SECTOR = "canary";

  const mount = document.getElementById("hmcanary");
  mount.innerHTML = `
    <div class="canary-wrap">
      <div class="canary-title">
        <div>
          <h2>canary</h2>
        </div>
      </div>
      <p class="canary-sub">Upload interview, meeting or hack transcript PDFs and generate a Known / Unknown x Agreed / Contested theme matrix.</p>
      <div class="canary-note"><strong>Confidentiality note:</strong> canary uses a separate vector store via <code>VECTOR_STORE_ID_canary</code>. Do not use for sensitive transcripts until storage retention, access and deletion policies are approved.</div>
      <div class="canary-row">
        <input class="canary-file" type="file" id="canaryFiles" accept="application/pdf" multiple />
        <button class="canary-btn" id="canaryUpload">Upload transcripts</button>
        <button class="canary-btn" id="canaryAnalyse">Analyse</button>
        <div class="canary-status" id="canaryStatus">Ready</div>
      </div>
      <div class="canary-divider"></div>
      <div class="canary-library" id="canaryLibrary"></div>
      <textarea class="canary-textarea" id="canaryContext" placeholder="Optional: add project context, research question, audience, or decision this should inform..."></textarea>
      <div class="canary-divider"></div>
      <div class="canary-results" id="canaryResults">Upload transcript PDFs, then select Analyse.</div>
    </div>
  `;

  const statusEl = mount.querySelector("#canaryStatus");
  const filesEl = mount.querySelector("#canaryFiles");
  const uploadBtn = mount.querySelector("#canaryUpload");
  const analyseBtn = mount.querySelector("#canaryAnalyse");
  const contextEl = mount.querySelector("#canaryContext");
  const resultsEl = mount.querySelector("#canaryResults");
  const libraryEl = mount.querySelector("#canaryLibrary");

let uploaded = [];

async function loadLibrary() {
  const resp = await fetch(`${API_BASE}/api/canary-library`, {
    method: "GET",
    headers: headersJson()
  });

  const data = await resp.json().catch(() => ({}));

  if (!resp.ok || data.error) {
    throw new Error(data.details || data.error || "Library load failed");
  }

  uploaded = Array.isArray(data.items) ? data.items : [];
  renderLibrary();
}

async function updateLibrary(action, payload = {}) {
  const resp = await fetch(`${API_BASE}/api/canary-library`, {
    method: "POST",
    headers: headersJson(),
    body: JSON.stringify({ action, ...payload })
  });

  const data = await resp.json().catch(() => ({}));

  if (!resp.ok || data.error) {
    throw new Error(data.details || data.error || "Library update failed");
  }

  uploaded = Array.isArray(data.items) ? data.items : [];
  renderLibrary();
}

function renderLibrary() {
  const selectedCount = uploaded.filter((f) => f.selected !== false).length;

  libraryEl.innerHTML = `
    <div class="canary-library-title">
      LIBRARY (${uploaded.length}) — ${selectedCount} SELECTED
    </div>
    ${
      uploaded.length
        ? uploaded.map((file, index) => `
          <div class="canary-library-item">
            <div class="canary-library-meta">
              <strong>${escapeHtml(file.name)}</strong>
              <div>TYPE: TRANSCRIPT</div>
              <div>ADDED: ${escapeHtml(file.addedAt || "")}</div>
            </div>
            <div class="canary-library-actions">
              <button class="canary-btn canary-select-toggle" data-index="${index}">
                ${file.selected === false ? "DESELECTED" : "SELECTED"}
              </button>
              <button class="canary-btn canary-delete" data-index="${index}">
                DELETE
              </button>
            </div>
          </div>
        `).join("")
        : `<div class="canary-library-empty">No transcripts uploaded yet.</div>`
    }
  `;

  libraryEl.querySelectorAll(".canary-select-toggle").forEach((button) => {
    button.addEventListener("click", () => {
      const index = Number(button.dataset.index);

      updateLibrary("toggle", { id: uploaded[index].id }).catch((err) => {
        setStatus("Library update failed", true);
        resultsEl.innerHTML = `<p><strong>Error:</strong> ${escapeHtml(err.message || err)}</p>`;
      });
    });
  });

  libraryEl.querySelectorAll(".canary-delete").forEach((button) => {
    button.addEventListener("click", () => {
      const index = Number(button.dataset.index);

      updateLibrary("delete", { id: uploaded[index].id }).catch((err) => {
        setStatus("Library update failed", true);
        resultsEl.innerHTML = `<p><strong>Error:</strong> ${escapeHtml(err.message || err)}</p>`;
      });
    });
  });
}

  let sessionToken = localStorage.getItem("hm_canary_sessionToken") || crypto.randomUUID();
  localStorage.setItem("hm_canary_sessionToken", sessionToken);

  function setStatus(text, isError=false){
    statusEl.textContent = text || "";
    statusEl.classList.toggle("is-error", !!isError);
  }

  function headersJson(extra={}){
    const h = { "Content-Type":"application/json", ...extra };
    if (DEMO_TOKEN) h.Authorization = "Bearer " + DEMO_TOKEN;
    if (sessionToken) h["x-session-token"] = sessionToken;
    return h;
  }

  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
  }

  function formatMarkdown(text){
    let html = escapeHtml(text)
      .replace(/^###\s+(.+)$/gm, "<p><strong>$1</strong></p>")
      .replace(/^##\s+(.+)$/gm, "<p><strong>$1</strong></p>")
      .replace(/^#\s+(.+)$/gm, "<p><strong>$1</strong></p>")
      .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

    const lines = html.split("\n");
    const out = [];
    let inList = false;
    for (const line of lines) {
      if (/^\s*-\s+/.test(line)) {
        if (!inList) { out.push("<ul>"); inList = true; }
        out.push("<li>" + line.replace(/^\s*-\s+/, "") + "</li>");
      } else {
        if (inList) { out.push("</ul>"); inList = false; }
        if (line.trim()) out.push("<p>" + line + "</p>");
      }
    }
    if (inList) out.push("</ul>");
    html = out.join("");

    html = html.replace(/<p>\|([\s\S]*?)\|<\/p>(?:<p>\|[-:\s|]+\|<\/p>)((?:<p>\|[\s\S]*?\|<\/p>)+)/g, (m, header, rows) => {
      const ths = header.split("|").map(c => c.trim()).filter(Boolean).map(c => `<th>${c}</th>`).join("");
      const trs = rows.match(/<p>\|[\s\S]*?\|<\/p>/g).map(r => {
        const cells = r
          .replace(/^<p>\||\|<\/p>$/g, "")
          .split("|")
          .map(c => `<td>${c.trim().replace(/&lt;br&gt;/g, "<br>")}</td>`)
          .join("");
        return `<tr>${cells}</tr>`;
      }).join("");
      return `<div class="canary-table-wrap"><table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table></div>`;
    });
    return html;
  }

  async function uploadOne(file){
    const fd = new FormData();
    fd.append("file", file);
    const uploadResp = await fetch(`${API_BASE}/api/upload`, {
      method:"POST",
      headers: DEMO_TOKEN ? { Authorization:"Bearer " + DEMO_TOKEN, "x-session-token":sessionToken } : { "x-session-token":sessionToken },
      body:fd
    });
    const uploadData = await uploadResp.json().catch(() => ({}));
    if (!uploadResp.ok) throw new Error(uploadData.details || uploadData.error || `Upload failed for ${file.name}`);

    const ingestResp = await fetch(`${API_BASE}/api/ingest`, {
      method:"POST",
      headers:headersJson(),
      body:JSON.stringify({ sector:SECTOR, blobUrl:uploadData.blobUrl || uploadData.url || uploadData.publicUrl, filename:file.name, size:file.size, tags:{ company:"canary", topics:["Transcript", "Interview"] } })
    });
    const ingestData = await ingestResp.json().catch(() => ({}));
    if (!ingestResp.ok || ingestData.error) throw new Error(ingestData.details || ingestData.error || `Ingest failed for ${file.name}`);
    return { name:file.name, duplicate:!!ingestData.duplicate };
  }

async function uploadFiles(){
  const files = Array.from(filesEl.files || []);
  if (!files.length) { setStatus("Choose PDFs", true); return; }
  uploadBtn.disabled = true; analyseBtn.disabled = true;

  try {
    for (let i = 0; i < files.length; i++) {
      setStatus(`Uploading ${i + 1}/${files.length}`);
      const uploadedFile = await uploadOne(files[i]);

      await updateLibrary("add", {
        item: {
          id: crypto.randomUUID(),
          ...uploadedFile,
          selected: true,
          addedAt: new Date().toLocaleString()
        }
      });
    }

    resultsEl.innerHTML = `<p><strong>Uploaded</strong></p><ul>${uploaded.map(f => `<li>${escapeHtml(f.name)}${f.duplicate ? " — already in canary" : ""}</li>`).join("")}</ul>`;
    setStatus("Uploaded");

  } catch (err) {
    setStatus("Upload failed", true);
    resultsEl.innerHTML = `<p><strong>Error:</strong> ${escapeHtml(err.message || err)}</p>`;
  } finally {
    uploadBtn.disabled = false;
    analyseBtn.disabled = false;
  }
}

  async function analyse(){
    analyseBtn.disabled = true; uploadBtn.disabled = true;
    setStatus("Analysing");
    const selectedUploads = uploaded.filter((file) => file.selected !== false);

    if (!selectedUploads.length) {
      setStatus("Select at least one transcript", true);
      analyseBtn.disabled = false;
      uploadBtn.disabled = false;
      return;
    }
    resultsEl.innerHTML = "<p><strong>Analysing transcripts...</strong></p>";
    try {
      const context = contextEl.value.trim();
      const question = [
        "canary ANALYSIS REQUEST",
        "Analyse the uploaded interviews, meetings, hacks and transcripts.",
        `Use only these selected transcripts: ${selectedUploads.map((f) => f.name).join(", ")}`,
        context ? `Project context: ${context}` : "",
        "Output a 2x2 matrix in bullet points.",
        "X-axis: Known <-> Unknown.",
        "Y-axis: Agreed <-> Contested.",
        "Finish with a simple summary of universal themes from the bottom half and unique themes from the top half."
      ].filter(Boolean).join("\n");

      const resp = await fetch(`${API_BASE}/api/ask`, {
        method:"POST",
        headers:headersJson(),
        body:JSON.stringify({ sector:SECTOR, outputFormat:"canary", question, history:[] })
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || data.error) throw new Error(data.details || data.error || "Analysis failed");
      resultsEl.innerHTML = formatMarkdown(data.answer || "No answer returned.");
      setStatus("Done");
    } catch (err) {
      setStatus("Analysis failed", true);
      resultsEl.innerHTML = `<p><strong>Error:</strong> ${escapeHtml(err.message || err)}</p>`;
    } finally {
      analyseBtn.disabled = false; uploadBtn.disabled = false;
    }
  }

  uploadBtn.addEventListener("click", uploadFiles);
analyseBtn.addEventListener("click", analyse);

loadLibrary().catch((err) => {
  setStatus("Library load failed", true);
  resultsEl.innerHTML = `<p><strong>Error:</strong> ${escapeHtml(err.message || err)}</p>`;
});
})();
</script>
